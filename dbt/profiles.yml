on_prem_medallion:
  target: dev
  outputs:
    dev:
      type: sqlserver
      driver: "{{ env_var('SQLSERVER_DRIVER', 'ODBC Driver 18 for SQL Server') }}"
      server: "{{ env_var('SQLSERVER_HOST') }}"
      port: "{{ env_var('SQLSERVER_PORT', '1433') | int }}"
      database: "{{ env_var('SQLSERVER_DATABASE') }}"
      schema: dbo
      user: "{{ env_var('SQLSERVER_USERNAME') }}"
      password: "{{ env_var('SQLSERVER_PASSWORD') }}"
      trust_cert: "{{ env_var('SQLSERVER_TRUST_CERTIFICATE', 'yes') }}"
      threads: 4
